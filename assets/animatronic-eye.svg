<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="title desc">
<title id="title">3D Animatronic Eye</title>
<desc id="desc">A futuristic 3D eye that moves its pupil and blinks.</desc>
<defs>
  <radialGradient id="space" cx="50%" cy="45%">
    <stop offset="0%" stop-color="#18265c"/>
    <stop offset="55%" stop-color="#080d25"/>
    <stop offset="100%" stop-color="#02040d"/>
  </radialGradient>
  <radialGradient id="sclera" cx="42%" cy="35%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="70%" stop-color="#dce7f5"/>
    <stop offset="100%" stop-color="#8d9bb2"/>
  </radialGradient>
  <radialGradient id="iris" cx="40%" cy="35%">
    <stop offset="0%" stop-color="#b9ffff"/>
    <stop offset="38%" stop-color="#39d9ff"/>
    <stop offset="72%" stop-color="#1767c7"/>
    <stop offset="100%" stop-color="#071a56"/>
  </radialGradient>
  <radialGradient id="pupil" cx="35%" cy="30%">
    <stop offset="0%" stop-color="#17233d"/>
    <stop offset="100%" stop-color="#00030a"/>
  </radialGradient>
  <filter id="glow">
    <feGaussianBlur stdDeviation="7" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="eyeClip">
    <path d="M90 250 Q450 55 810 250 Q450 445 90 250Z"/>
  </clipPath>
  <linearGradient id="lid" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="#27345e"/>
    <stop offset="55%" stop-color="#0d1531"/>
    <stop offset="100%" stop-color="#050814"/>
  </linearGradient>
</defs>

<rect width="900" height="500" rx="28" fill="url(#space)"/>

<!-- stars -->
<g fill="#b8d9ff" opacity=".8">
  <circle cx="70" cy="80" r="2"/><circle cx="160" cy="390" r="1.5"/><circle cx="250" cy="65" r="1.5"/>
  <circle cx="680" cy="70" r="2"/><circle cx="790" cy="380" r="1.5"/><circle cx="845" cy="150" r="2"/>
  <circle cx="600" cy="430" r="1.5"/><circle cx="330" cy="430" r="2"/><circle cx="110" cy="300" r="1"/>
</g>

<!-- 3D eye housing -->
<path d="M72 250 Q450 32 828 250 Q450 468 72 250Z" fill="#02040b" stroke="#5f78c9" stroke-width="7" filter="url(#glow)"/>
<path d="M90 250 Q450 55 810 250 Q450 445 90 250Z" fill="url(#sclera)" stroke="#9fb7e8" stroke-width="3"/>

<!-- iris and moving pupil -->
<g clip-path="url(#eyeClip)">
  <circle cx="450" cy="250" r="122" fill="#10376d" opacity=".5" filter="url(#glow)"/>
  <circle cx="450" cy="250" r="108" fill="url(#iris)" stroke="#74ecff" stroke-width="5"/>
  <g fill="none" stroke="#a7f7ff" opacity=".75">
    <circle cx="450" cy="250" r="92" stroke-width="3"/>
    <circle cx="450" cy="250" r="78" stroke-width="2"/>
    <path d="M450 142V358M342 250H558M374 174L526 326M526 174L374 326" stroke-width="2"/>
  </g>
  <g>
    <circle r="48" fill="url(#pupil)" stroke="#4de5ff" stroke-width="4">
      <animateTransform attributeName="transform" type="translate" values="0 0;35 -12;55 0;28 15;0 0;-30 -10;-45 5;-20 14;0 0" keyTimes="0;.12;.24;.36;.5;.64;.76;.88;1" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <ellipse rx="17" ry="9" fill="#ffffff" opacity=".85">
      <animateTransform attributeName="transform" type="translate" values="0 0;35 -12;55 0;28 15;0 0;-30 -10;-45 5;-20 14;0 0" keyTimes="0;.12;.24;.36;.5;.64;.76;.88;1" dur="5.5s" repeatCount="indefinite"/>
    </ellipse>
  </g>
</g>

<!-- animated eyelids: open → blink → open -->
<g fill="url(#lid)" stroke="#6f8bd9" stroke-width="4">
  <path d="M72 250 Q450 32 828 250 L810 250 Q450 105 90 250Z">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="M72 250 Q450 32 828 250 L810 250 Q450 105 90 250Z;
              M72 250 Q450 32 828 250 L810 250 Q450 105 90 250Z;
              M72 250 Q450 32 828 250 L810 250 Q450 250 90 250Z;
              M72 250 Q450 32 828 250 L810 250 Q450 105 90 250Z;
              M72 250 Q450 32 828 250 L810 250 Q450 105 90 250Z"
      keyTimes="0;.72;.78;.84;1"/>
  </path>
  <path d="M72 250 Q450 468 828 250 L810 250 Q450 395 90 250Z">
    <animate attributeName="d" dur="5.5s" repeatCount="indefinite"
      values="M72 250 Q450 468 828 250 L810 250 Q450 395 90 250Z;
              M72 250 Q450 468 828 250 L810 250 Q450 395 90 250Z;
              M72 250 Q450 468 828 250 L810 250 Q450 250 90 250Z;
              M72 250 Q450 468 828 250 L810 250 Q450 395 90 250Z;
              M72 250 Q450 468 828 250 L810 250 Q450 395 90 250Z"
      keyTimes="0;.72;.78;.84;1"/>
  </path>
</g>

<!-- scan line -->
<rect x="100" y="110" width="700" height="3" rx="2" fill="#63e7ff" opacity=".35">
  <animate attributeName="y" values="110;390;110" dur="4s" repeatCount="indefinite"/>
</rect>

<text x="450" y="475" text-anchor="middle" fill="#9eeaff" font-family="monospace" font-size="20" letter-spacing="3">ANIMATRONIC VISION • AI + HARDWARE</text>
</svg>